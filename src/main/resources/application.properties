spring.application.name=financeflow
spring.main.banner-mode=off
# Variáveis já definidas no ambiente têm prioridade sobre o .env local.
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:8080}
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=60s
server.error.whitelabel.enabled=false

# Somente as rotas declaradas em StaticAssetsController servem a tela.
spring.web.resources.add-mappings=false
spring.mvc.problemdetails.enabled=false

spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

# As migrações executam antes de o servidor aceitar requisições.
financeflow.database.migrate=true
