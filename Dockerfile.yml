# Etapa 1: baixar as dependencias e gerar o jar da API.
FROM maven:3.9-eclipse-temurin-21 AS build

WORKDIR /src
COPY pom.xml ./
RUN mvn -B -q dependency:go-offline

COPY src ./src
COPY web ./web
# Os testes rodam fora da imagem (alguns exigem um PostgreSQL descartavel).
RUN mvn -B -q -DskipTests package

# Etapa 2: executar apenas o jar com o runtime Java.
FROM eclipse-temurin:21-jre-alpine

COPY --from=build /src/target/financeflow.jar /app/financeflow.jar

WORKDIR /app
USER 65532:65532
EXPOSE 8080
ENTRYPOINT ["java", "-XX:MaxRAMPercentage=75", "-jar", "/app/financeflow.jar"]
