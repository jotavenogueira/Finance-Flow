# Etapa 1: baixar as dependencias e compilar a API para Linux.
FROM golang:1.27.3-alpine3.24 AS build

WORKDIR /src
COPY go.mod go.sum ./
RUN go mod download

COPY . .
RUN CGO_ENABLED=0 go build -trimpath -o /out/financeflow .

# Etapa 2: executar apenas o programa compilado.
FROM scratch

COPY --from=build /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/
COPY --from=build /out/financeflow /app/financeflow

WORKDIR /app
USER 65532:65532
EXPOSE 8080
ENTRYPOINT ["/app/financeflow"]
