services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.yml
    restart: unless-stopped
    environment:
      GIN_MODE: release
      PORT: "8080"
      # Entre containers, use o nome do servico e a porta interna.
      DB_HOST: go_db
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env ou no ambiente}
      DB_NAME: ${DB_NAME:-postgres}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    depends_on:
      go_db:
        condition: service_healthy

  go_db:
    container_name: go_db
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no .env ou no ambiente}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      # PostgreSQL 18 usa este ponto de montagem.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata: {}
